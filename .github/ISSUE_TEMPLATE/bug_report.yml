name: 🐛 Bug Report
description: Report a reproducible defect, crash, or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run '...'
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Console Output
      description: Paste any relevant terminal output, browser console logs, or stack traces.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Environment
      options:
        - Windows 11 / PowerShell
        - macOS
        - Linux / Ubuntu
        - Docker / WSL2
        - Other (specify in description)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verification Checklist
      options:
        - label: I have verified this is not a duplicate issue.
          required: true
        - label: I have run `npm run typecheck` and `npm run test` before filing.
          required: false
