[project]
name = "aicon-api"
version = "0.1.0"
description = "AICON Hackathon Optional Python FastAPI Sidecar"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
aicon-hackathon = "aicon_hackathon.main:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
